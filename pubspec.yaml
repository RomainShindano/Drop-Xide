name: drop_xide
description: "Flutter project build automation and deployment tool"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.4
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  
  # File Operations
  path: ^1.9.1
  
  # YAML Parsing
  yaml: ^3.1.2
  
  # HTTP & API
  http: ^1.2.2
  googleapis: ^14.0.0
  googleapis_auth: ^1.6.0
  
  # JSON Serialization
  json_annotation: ^4.12.0
  
  # Logging
  logging: ^1.3.0
  
  # UI & UX
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  
  # Process Management
  process_run: ^1.2.1
  
  # UUID Generation
  uuid: ^4.5.1
  
  # Window Management
  window_manager: ^0.5.2
  macos_ui: ^2.2.2
  _discoveryapis_commons: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # JSON Serialization
  build_runner: ^2.4.15
  json_serializable: ^6.9.2
  
  # Testing
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
